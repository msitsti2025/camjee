<meta charset="utf-8">
<title>깜지 — 과방위 국정감사 질의·답변</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --paper: #F6F7F4;
    --panel: #FFFFFF;
    --ink: #1C1E22;
    --ink-soft: #5A6068;
    --line: #DFE2DC;
    --navy: #233C6B;
    --navy-deep: #1A2C4F;
    --seal: #B0392E;
    --q-bg: #FFF3BF;
    --q-line: #E8D26B;
    --q-label: #8A6D00;
    --sel-bg: #EEF2F9;
    --sel-edge: #233C6B;
    --dem: #152484;
    --ppp: #E61E2B;
    --cho: #0057A8;
    --ind: #667085;
    --chip-bg: #EEF0EA;
    --mark-bg: #FFE24D;
    --mark-ink: #1C1E22;
    --shadow: 0 1px 3px rgba(20,25,35,.08);
    --fs-scale: 1;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #14161A;
      --panel: #1D2026;
      --ink: #E7E9EC;
      --ink-soft: #9AA1AB;
      --line: #2C3038;
      --navy: #8FA9D8;
      --navy-deep: #10182A;
      --seal: #C9564A;
      --q-bg: #3A3312;
      --q-line: #6B5C1E;
      --q-label: #E4C95B;
      --sel-bg: #262E3E;
      --sel-edge: #8FA9D8;
      --dem: #6C7FE0;
      --ppp: #F0666F;
      --cho: #5B9BD5;
      --ind: #8B93A1;
      --chip-bg: #2A2E36;
      --mark-bg: #C9A93A;
      --mark-ink: #14161A;
      --shadow: 0 1px 3px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="light"] {
    --paper: #F6F7F4; --panel: #FFFFFF; --ink: #1C1E22; --ink-soft: #5A6068;
    --line: #DFE2DC; --navy: #233C6B; --navy-deep: #1A2C4F; --seal: #B0392E;
    --q-bg: #FFF3BF; --q-line: #E8D26B; --q-label: #8A6D00;
    --sel-bg: #EEF2F9; --sel-edge: #233C6B;
    --dem: #152484; --ppp: #E61E2B; --cho: #0057A8; --ind: #667085;
    --chip-bg: #EEF0EA; --shadow: 0 1px 3px rgba(20,25,35,.08);
    --mark-bg: #FFE24D; --mark-ink: #1C1E22;
  }
  :root[data-theme="dark"] {
    --paper: #14161A; --panel: #1D2026; --ink: #E7E9EC; --ink-soft: #9AA1AB;
    --line: #2C3038; --navy: #8FA9D8; --navy-deep: #10182A; --seal: #C9564A;
    --q-bg: #3A3312; --q-line: #6B5C1E; --q-label: #E4C95B;
    --sel-bg: #262E3E; --sel-edge: #8FA9D8;
    --dem: #6C7FE0; --ppp: #F0666F; --cho: #5B9BD5; --ind: #8B93A1;
    --chip-bg: #2A2E36; --shadow: 0 1px 3px rgba(0,0,0,.4);
    --mark-bg: #C9A93A; --mark-ink: #14161A;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont,
      "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    background: var(--paper);
    color: var(--ink);
    font-size: 15px;
    line-height: 1.55;
    overflow: hidden;
  }
  button { font: inherit; cursor: pointer; color: inherit; }
  input, textarea { font: inherit; color: var(--ink); }
  :focus-visible { outline: 2px solid var(--navy); outline-offset: 1px; }

  /* ── 상단 헤더 ─────────────────────────── */
  header {
    height: 56px;
    background: var(--navy-deep);
    color: #F2F4F8;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 0 16px;
  }
  .logo { display: flex; align-items: center; gap: 10px; flex: none; }
  .logo .seal {
    width: 38px; height: 38px;
    background: var(--seal);
    color: #FFF;
    border-radius: 6px;
    display: grid; place-items: center;
    font-weight: 800; font-size: 15px;
    letter-spacing: 1px;
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.25);
  }
  .logo .sub { font-size: 12px; opacity: .75; margin-left: 2px; }
  .searchwrap { position: relative; flex: 1; max-width: 420px; margin-left: auto; }
  .searchwrap input {
    width: 100%; height: 34px;
    border: 1px solid rgba(255,255,255,.25);
    background: rgba(255,255,255,.12);
    color: #FFF;
    border-radius: 17px;
    padding: 0 14px;
    font-size: 14px;
  }
  .searchwrap input::placeholder { color: rgba(255,255,255,.55); }
  .search-results {
    position: absolute; top: 40px; left: 0; right: 0;
    background: var(--panel);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: 0 8px 24px rgba(10,15,25,.25);
    max-height: 55vh; overflow-y: auto;
    z-index: 50;
    display: none;
  }
  .search-results.open { display: block; }
  .search-results button {
    display: block; width: 100%; text-align: left;
    padding: 10px 14px;
    border: 0; background: none;
    border-bottom: 1px solid var(--line);
  }
  .search-results button:last-child { border-bottom: 0; }
  .search-results button:hover { background: var(--sel-bg); }
  .sr-member { font-size: 12px; color: var(--ink-soft); }
  .sr-title { font-weight: 600; }
  .hdr-btn {
    flex: none;
    height: 34px;
    padding: 0 14px;
    border-radius: 17px;
    border: 1px solid rgba(255,255,255,.3);
    background: transparent;
    color: #F2F4F8;
    font-size: 13px;
    font-weight: 600;
  }
  .hdr-btn:hover { background: rgba(255,255,255,.12); }
  .hdr-btn.active { background: var(--seal); border-color: var(--seal); }
  .hdr-btn.accent { background: #2A7D4F; border-color: #2A7D4F; }
  .hdr-btn.accent:hover { background: #348F5C; border-color: #348F5C; }
  .hdr-btn[hidden] { display: none; }
  .edit-tools { display: none; gap: 8px; }
  body.editing .edit-tools { display: flex; }
  .mode-toggle {
    flex: none;
    display: flex;
    border: 1px solid rgba(255,255,255,.3);
    border-radius: 17px;
    overflow: hidden;
  }
  .mt-btn {
    height: 32px;
    padding: 0 12px;
    border: 0;
    background: transparent;
    color: #F2F4F8;
    font-size: 13px;
    font-weight: 600;
  }
  .mt-btn.active { background: rgba(255,255,255,.22); }
  .mt-btn:not(.active):hover { background: rgba(255,255,255,.1); }

  /* ── 공용 데이터 상태 표시 ────────────────── */
  .sync-chip {
    flex: none;
    height: 30px;
    padding: 0 12px;
    border-radius: 15px;
    border: 1px solid rgba(255,255,255,.3);
    background: transparent;
    color: #F2F4F8;
    font-size: 12.5px;
    font-weight: 700;
    white-space: nowrap;
    max-width: 210px;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .sync-chip.draft { background: var(--seal); border-color: var(--seal); }
  .sync-chip.offline { opacity: .6; }
  #banner {
    flex: none;
    display: flex; align-items: center; flex-wrap: wrap; gap: 10px;
    padding: 9px 16px;
    background: var(--q-bg);
    color: var(--ink);
    border-bottom: 1px solid var(--q-line);
    font-size: 13.5px;
  }
  #banner[hidden] { display: none; }
  .banner-btns { display: flex; gap: 8px; margin-left: auto; }
  .bn-btn {
    border: 1px solid var(--q-line);
    background: transparent;
    color: var(--ink);
    border-radius: 8px;
    padding: 5px 12px;
    font-size: 13px; font-weight: 600;
    white-space: nowrap;
  }
  .bn-btn.primary { background: var(--navy); border-color: var(--navy); color: var(--paper); }
  :root[data-theme="light"] .bn-btn.primary { color: #FFF; }

  /* ── 3분할 레이아웃 ─────────────────────── */
  body { display: flex; flex-direction: column; }
  header { flex: none; }
  main {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: 20% 30% 50%;
  }
  .pane { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); }
  .pane:last-child { border-right: 0; }
  .pane-head {
    flex: none;
    padding: 10px 14px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
    display: flex; align-items: center; gap: 8px;
    min-height: 48px;
  }
  .pane-title { font-size: 13px; font-weight: 700; color: var(--ink-soft); letter-spacing: .08em; }
  .pane-body { flex: 1; overflow-y: auto; min-height: 0; }
  .back-btn {
    display: none;
    flex: none;
    white-space: nowrap;
    border: 1px solid var(--line); background: var(--panel);
    border-radius: 8px; padding: 5px 11px; font-size: 13px; font-weight: 600;
  }
  #qa-head-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ── ① 위원 패널 ───────────────────────── */
  #pane-members .pane-body { padding: 10px; }
  .chair-box {
    width: 100%;
    border: 0;
    background: var(--navy);
    color: #FFF;
    border-radius: 10px;
    padding: 12px 10px;
    text-align: center;
    margin-bottom: 10px;
    box-shadow: var(--shadow);
  }
  :root[data-theme="dark"] .chair-box, .dark-chair { color: #10182A; }
  @media (prefers-color-scheme: dark) { .chair-box { color: #10182A; } }
  :root[data-theme="light"] .chair-box { color: #FFF; }
  .chair-box .role { font-size: 12px; letter-spacing: .12em; opacity: .8; }
  .chair-box .nm { font-size: clamp(19px, 1.75vw, 26px); font-weight: 800; margin-top: 2px; }
  .party-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .party-col { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .party-label {
    font-size: 12.5px; font-weight: 700; text-align: center;
    letter-spacing: .05em; padding: 4px 0;
    border-radius: 6px; color: #FFF;
  }
  .party-label.dem { background: var(--dem); }
  .party-label.ppp { background: var(--ppp); }
  .m-box {
    border: 1px solid var(--line);
    border-left: 5px solid var(--ind);
    background: var(--panel);
    border-radius: 8px;
    padding: 10px 4px;
    min-height: 58px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    text-align: center;
    box-shadow: var(--shadow);
    position: relative;
  }
  .m-box.dem { border-left-color: var(--dem); }
  .m-box.ppp { border-left-color: var(--ppp); }
  .m-box.cho { border-left-color: var(--cho); }
  .m-name {
    font-size: clamp(17px, 1.55vw, 23px);
    font-weight: 700;
    line-height: 1.2;
    letter-spacing: -.02em;
  }
  .m-sub { font-size: 12px; color: var(--ink-soft); font-weight: 600; line-height: 1.2; }
  .m-box.sel { background: var(--sel-bg); border-color: var(--sel-edge); box-shadow: 0 0 0 2px var(--sel-edge); }
  .m-box.sel .m-name { color: var(--navy); }
  .m-box .cnt {
    position: absolute; top: 3px; right: 5px;
    font-size: 11px; font-weight: 700;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
  }
  .etc-label {
    margin: 12px 0 6px;
    font-size: 12px; font-weight: 700; color: var(--ink-soft);
    text-align: center; letter-spacing: .08em;
  }
  .etc-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  /* ── ② 질문 목록 패널 ───────────────────── */
  #pane-questions .pane-head { flex-wrap: wrap; }
  #q-member-name { font-size: 18px; font-weight: 800; }
  .p-chip {
    font-size: 12px; font-weight: 700; color: #FFF;
    border-radius: 5px; padding: 2px 8px;
  }
  .p-chip.dem { background: var(--dem); }
  .p-chip.ppp { background: var(--ppp); }
  .p-chip.cho { background: var(--cho); }
  .p-chip.ind { background: var(--ind); }
  #q-filter {
    margin-left: auto;
    height: 30px; width: 110px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--paper);
    padding: 0 10px;
    font-size: 13px;
  }
  .q-list { list-style: none; }
  .q-row {
    width: 100%;
    display: flex; gap: 11px; align-items: flex-start;
    text-align: left;
    padding: 13px 14px;
    background: none; border: 0;
    border-bottom: 1px solid var(--line);
  }
  .q-row:hover { background: var(--sel-bg); }
  .q-row.sel { background: var(--sel-bg); box-shadow: inset 4px 0 0 var(--sel-edge); }
  .q-num {
    flex: none;
    width: 30px; height: 30px;
    border-radius: 50%;
    background: var(--chip-bg);
    color: var(--ink-soft);
    display: grid; place-items: center;
    font-size: 14px; font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .q-row.filled .q-num { background: var(--navy); color: var(--paper); }
  .q-main { min-width: 0; }
  .q-title { font-weight: 700; font-size: clamp(15.5px, 1.35vw, 19px); line-height: 1.4; }
  .q-row.sel .q-title { color: var(--navy); }
  .q-row.empty .q-title { color: var(--ink-soft); font-weight: 500; }
  .q-kws { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; }
  .kw {
    font-size: 12.5px;
    background: var(--chip-bg);
    color: var(--ink-soft);
    border-radius: 4px;
    padding: 1px 7px;
  }
  .q-code { font-size: 12px; color: var(--ink-soft); margin-top: 4px; }
  .add-row {
    display: none;
    margin: 10px 14px 20px;
    padding: 8px 14px;
    border: 1px dashed var(--line);
    border-radius: 8px;
    background: none;
    color: var(--ink-soft);
    font-size: 13px; font-weight: 600;
    width: calc(100% - 28px);
  }
  body.editing .add-row { display: block; }
  .add-row:hover { border-color: var(--navy); color: var(--navy); }

  /* ── ③ 질의/답변 패널 ───────────────────── */
  #pane-qa .pane-body { display: flex; flex-direction: column; overflow: hidden; }
  /* 질문 패드는 내용만큼만 차지하고(최대 55%), 남는 공간은 답변이 채움 */
  .qa-question {
    --q-lh: calc(16.5px * var(--fs-scale) * 1.55);
    flex: 0 0 auto;
    max-height: 55%;
    background: var(--q-bg);
    background-image: repeating-linear-gradient(
      to bottom,
      transparent 0 calc(var(--q-lh) - 1px),
      color-mix(in srgb, var(--q-line) 45%, transparent) calc(var(--q-lh) - 1px) var(--q-lh));
    background-position: 0 calc(14px + var(--q-lh) * .82);
    border-bottom: 2px solid var(--q-line);
    overflow-y: auto;
    padding: 14px 20px 16px;
  }
  .qa-answer { flex: 1 1 0; min-height: 0; overflow-y: auto; padding: 14px 20px 30px; background: var(--panel); }
  .qa-label {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 12px; font-weight: 800; letter-spacing: .15em;
    margin-bottom: 8px;
  }
  .qa-question .qa-label { color: var(--q-label); }
  .qa-answer .qa-label { color: var(--navy); }
  .qa-code {
    font-size: 11px; font-weight: 700;
    border: 1px solid currentColor;
    border-radius: 4px; padding: 1px 6px;
    letter-spacing: 0;
  }
  .qa-q-text { font-size: calc(16.5px * var(--fs-scale)); line-height: 1.55; font-weight: 700; max-width: 46em; }
  .qa-a-text { font-size: calc(15px * var(--fs-scale)); max-width: 46em; }
  .qa-q-text.qa-empty, .qa-a-text.qa-empty { font-weight: 400; color: var(--ink-soft); }

  /* 마크업 서식 */
  .qa-q-text h3, .qa-a-text h3 { font-size: 1.3em; margin: .7em 0 .3em; }
  .qa-q-text h4, .qa-a-text h4 { font-size: 1.15em; margin: .6em 0 .25em; }
  .qa-q-text ul, .qa-a-text ul { padding-left: 1.4em; margin: .3em 0; }
  .qa-q-text blockquote, .qa-a-text blockquote {
    border-left: 3px solid var(--q-line);
    padding: 2px 0 2px 12px;
    color: var(--ink-soft);
    margin: .4em 0;
  }
  .qa-q-text code, .qa-a-text code { background: var(--chip-bg); border-radius: 4px; padding: 1px 6px; font-size: .92em; }
  .qa-q-text hr, .qa-a-text hr { border: 0; border-top: 1px dashed var(--line); margin: .8em 0; }
  .qa-q-text mark, .qa-a-text mark { background: var(--mark-bg); color: var(--mark-ink); padding: 0 3px; border-radius: 3px; }
  .qa-q-text img, .qa-a-text img {
    display: block;
    max-width: 100%;
    margin: 8px 0;
    border: 1px solid var(--line);
    border-radius: 8px;
  }
  .md-gap { height: .85em; }

  /* 글자 크기 조절 */
  .fs-ctrl { margin-left: auto; display: flex; align-items: center; gap: 4px; }
  .fs-btn {
    width: 36px; height: 30px;
    border: 1px solid var(--line);
    background: var(--panel);
    border-radius: 8px;
    font-weight: 700; font-size: 13px;
  }
  .fs-btn:hover { border-color: var(--navy); color: var(--navy); }
  #fs-level {
    font-size: 12px; color: var(--ink-soft);
    min-width: 40px; text-align: center;
    font-variant-numeric: tabular-nums;
  }
  .qa-contact {
    margin-top: 14px;
    font-size: 12.5px; color: var(--ink-soft);
    border-top: 1px dashed var(--line);
    padding-top: 8px;
  }
  .qa-empty { color: var(--ink-soft); font-size: 14px; padding: 20px 0; }

  #qa-view { display: flex; flex-direction: column; flex: 1; min-height: 0; }

  /* 편집 폼 */
  .edit-form { display: none; flex-direction: column; gap: 10px; padding: 14px 20px 30px; overflow-y: auto; flex: 1; }
  body.editing #qa-view { display: none; }
  body.editing .edit-form { display: flex; }
  .edit-form label { font-size: 12px; font-weight: 700; color: var(--ink-soft); }
  .edit-form input, .edit-form textarea {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--panel);
    padding: 8px 10px;
    font-size: 14px;
  }
  .edit-form textarea { resize: vertical; line-height: 1.55; }
  .edit-form textarea.dragover { outline: 2px dashed var(--navy); outline-offset: -2px; }
  .md-hint { font-size: 12px; color: var(--ink-soft); line-height: 1.6; margin-top: -4px; }
  .md-hint code { background: var(--chip-bg); border-radius: 3px; padding: 0 4px; }
  #ef-question { background: var(--q-bg); min-height: 110px; }
  #ef-answer { min-height: 200px; }
  .ef-btns { display: flex; gap: 8px; margin-top: 4px; }
  .btn-primary {
    background: var(--navy); color: var(--paper);
    border: 0; border-radius: 8px;
    padding: 9px 22px; font-weight: 700; font-size: 14px;
  }
  :root[data-theme="light"] .btn-primary { color: #FFF; }
  .btn-ghost {
    background: none; border: 1px solid var(--line);
    border-radius: 8px; padding: 9px 16px; font-size: 14px; color: var(--ink-soft);
  }
  .btn-danger { border-color: var(--seal); color: var(--seal); }
  .save-note { font-size: 12px; color: var(--ink-soft); }

  /* ── 보기 방식: 페이지 넘김 (mode-step) ────── */
  body.mode-step main { grid-template-columns: 100%; }
  body.mode-step .pane {
    display: none;
    border-right: 0;
    width: 100%;
    max-width: 820px;
    margin: 0 auto;
  }
  body.mode-step[data-view="members"]   #pane-members   { display: flex; }
  body.mode-step[data-view="questions"] #pane-questions { display: flex; }
  body.mode-step[data-view="qa"]        #pane-qa        { display: flex; }
  body.mode-step .back-btn { display: inline-block; }
  body.mode-step .qa-question { max-height: 45%; }

  @media (max-width: 900px) {
    .logo .sub { display: none; }
    .searchwrap { max-width: none; }
  }
  /* 편집 도구가 늘어나는 편집 모드에서는 좁은 화면일 때 조회용 요소를 접어 버튼 자리를 확보
     (편집을 끝내면 검색창·보기 전환이 다시 나타납니다) */
  @media (max-width: 1100px) {
    body.editing .searchwrap { display: none; }
  }
  @media (max-width: 900px) {
    body.editing .mode-toggle { display: none; }
    body.editing .sync-chip { max-width: 120px; }
  }

/* ── 기본 데이터 구성: 풀을 위원별로 배분 + 빈 행 채움 ── */
const SLOT_COUNT = 10;
const STORAGE_KEY = "kkamji_v1";
const SHARED_URL = "data.json";      // 저장소에 함께 올리는 공용 데이터 파일
const emptySlot = () => ({ t:"", k:[], code:"", q:"", a:"", c:"" });

function buildDefaultData() {
  const data = {};
  MEMBERS.forEach(m => { data[m.id] = []; });
  QA_POOL.forEach((qa, i) => {
    const m = MEMBERS[i % MEMBERS.length];
    data[m.id].push(JSON.parse(JSON.stringify(qa)));
  });
  MEMBERS.forEach(m => {
    while (data[m.id].length < SLOT_COUNT) data[m.id].push(emptySlot());
  });
  return data;
}

/* 위원별 배열만 추려 기본 구조에 얹기 (알 수 없는 키는 무시).
   반드시 깊은 복사 — 원본을 공유하면 편집이 공용본 사본까지 바꿔 버립니다. */
function adoptMembers(src) {
  const base = buildDefaultData();
  if (src && typeof src === "object") {
    MEMBERS.forEach(m => {
      if (Array.isArray(src[m.id])) base[m.id] = JSON.parse(JSON.stringify(src[m.id]));
    });
  }
  return base;
}

/* 로컬 작업본: { basedOn, exportedStamp, members } */
function readLocal() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    const p = JSON.parse(raw);
    if (!p || typeof p !== "object") return null;
    // 구버전(위원 배열이 최상위에 바로 있던 형식) 호환
    if (!p.members) return { basedOn: null, exportedStamp: null, members: p };
    return { basedOn: p.basedOn || null, exportedStamp: p.exportedStamp || null, members: p.members };
  } catch (e) { return null; }
}

let DATA = buildDefaultData();
let sharedStamp = null;        // 현재 적용된 공용본의 updatedAt
let sharedInfo = null;         // 공용본 메타(작성자 등)
let hasLocalDraft = false;     // 아직 공용본에 반영되지 않은 내 수정
let lastExportStamp = (readLocal() || {}).exportedStamp || null;

function saveData() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      basedOn: sharedStamp,
      exportedStamp: lastExportStamp,
      members: DATA
    }));
    hasLocalDraft = true;
    renderStatus();
    return true;
  } catch (e) {
    alert("저장하지 못했습니다. 브라우저 저장 용량(약 5MB)을 초과했을 수 있습니다.\n첨부 이미지를 줄이거나 '내보내기'로 백업 후 일부를 정리해 주세요.");
    return false;
  }
}
function clearLocalDraft() {
  try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
  hasLocalDraft = false;
}

/* ── 마크업 렌더러 (HTML 이스케이프 후 서식 적용) ───── */
function escHtml(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function mdInline(s, imgs) {
  s = s.replace(/\{\{(img\d+)\}\}/g, (m, key) =>
    imgs && imgs[key] ? '<img src="' + imgs[key] + '" alt="첨부 이미지">' : m);
  s = s.replace(/!\[([^\]]*)\]\((data:image\/[^)\s]+|https?:\/\/[^)\s]+)\)/g, '<img alt="$1" src="$2">');
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/==([^=]+)==/g, "<mark>$1</mark>");
  s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
  return s;
}
function mdRender(src, imgs) {
  const lines = String(src).split("\n");
  let html = "", listBuf = [];
  const flushList = () => {
    if (listBuf.length) { html += "<ul>" + listBuf.join("") + "</ul>"; listBuf = []; }
  };
  for (const raw of lines) {
    const t = raw.trim();
    if (t.startsWith("- ")) { listBuf.push("<li>" + mdInline(escHtml(t.slice(2)), imgs) + "</li>"); continue; }
    flushList();
    if (t === "") { html += '<div class="md-gap"></div>'; continue; }
    if (t.startsWith("### ")) { html += "<h4>" + mdInline(escHtml(t.slice(4)), imgs) + "</h4>"; continue; }
    if (t.startsWith("## "))  { html += "<h3>" + mdInline(escHtml(t.slice(3)), imgs) + "</h3>"; continue; }
    if (t.startsWith("# "))   { html += "<h3>" + mdInline(escHtml(t.slice(2)), imgs) + "</h3>"; continue; }
    if (/^---+$/.test(t)) { html += "<hr>"; continue; }
    if (t.startsWith("> ")) { html += "<blockquote>" + mdInline(escHtml(t.slice(2)), imgs) + "</blockquote>"; continue; }
    html += "<div>" + mdInline(escHtml(raw), imgs) + "</div>";
  }
  flushList();
  return html;
}

/* ── 편집 모드 ─────────────────────────── */
/* ── 공용 편집 암호 ─────────────────────────
   실수로 답변을 고치는 것을 막기 위한 잠금입니다. 페이지 소스를 열어 볼 수 있는
   사람은 우회할 수 있으므로 보안 장치가 아니며, 자료 보호는 배포 위치로 해야 합니다.
   암호 변경: 브라우저 콘솔에서 hashPw("새암호") 를 실행해 나온 값을 아래에 붙여넣으세요. */
const EDIT_PW_HASH = "fb85bbca-10";   // 기본 암호: kkamji2026
function hashPw(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return ((h >>> 0).toString(16).padStart(8, "0")) + "-" + s.length;
}
window.hashPw = hashPw;
const UNLOCK_KEY = "kkamji_unlocked";
function isUnlocked() {
  try { return sessionStorage.getItem(UNLOCK_KEY) === EDIT_PW_HASH; } catch (e) { return false; }
}
function requestUnlock() {
  if (!EDIT_PW_HASH || isUnlocked()) return true;
  const pw = prompt("편집 암호를 입력하세요.");
  if (pw === null) return false;
  if (hashPw(pw) !== EDIT_PW_HASH) { alert("암호가 맞지 않습니다."); return false; }
  try { sessionStorage.setItem(UNLOCK_KEY, EDIT_PW_HASH); } catch (e) {}
  return true;
}

$("btn-edit").addEventListener("click", () => {

/* ── 이미지 첨부 (드래그앤드롭 / 붙여넣기) ──────────── */
function compressImage(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const MAX = 1400;
      let w = img.naturalWidth, h = img.naturalHeight;
      if (w > MAX) { h = Math.round(h * MAX / w); w = MAX; }
      const cv = document.createElement("canvas");
      cv.width = w; cv.height = h;
      const cx = cv.getContext("2d");
      cx.fillStyle = "#FFFFFF";
      cx.fillRect(0, 0, w, h);
      cx.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      resolve(cv.toDataURL("image/jpeg", 0.85));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("이미지를 읽을 수 없습니다.")); };
    img.src = url;
  });
}
function nextImgKey() {
  let n = 0;
  Object.keys(pendingImgs).forEach(k => {
    const m = /^img(\d+)$/.exec(k);
    if (m) n = Math.max(n, parseInt(m[1], 10));
  });
  return "img" + (n + 1);
}
async function insertImageFile(ta, file) {
  if (!editing) return;
  try {
    const dataUrl = await compressImage(file);
    const key = nextImgKey();
    pendingImgs[key] = dataUrl;
    const token = "\n{{" + key + "}}\n";
    const pos = ta.selectionStart != null ? ta.selectionStart : ta.value.length;
    ta.value = ta.value.slice(0, pos) + token + ta.value.slice(pos);
    ta.focus();
    ta.selectionStart = ta.selectionEnd = pos + token.length;
    $("ef-note").textContent = "이미지 첨부됨 — 저장을 눌러야 반영됩니다.";
  } catch (err) {
    alert(err.message);
  }
}
function attachImageHandlers(ta) {
  ta.addEventListener("dragover", e => { e.preventDefault(); ta.classList.add("dragover"); });
  ta.addEventListener("dragleave", () => ta.classList.remove("dragover"));
  ta.addEventListener("drop", e => {
    e.preventDefault();
    ta.classList.remove("dragover");
    const files = Array.from(e.dataTransfer.files || []).filter(f => f.type.startsWith("image/"));
    files.forEach(f => insertImageFile(ta, f));
  });
  ta.addEventListener("paste", e => {
    const items = Array.from(e.clipboardData.items || []).filter(it => it.type.startsWith("image/"));
    if (!items.length) return;
    e.preventDefault();
    items.forEach(it => { const f = it.getAsFile(); if (f) insertImageFile(ta, f); });
  });
}
attachImageHandlers($("ef-question"));
attachImageHandlers($("ef-answer"));

const FS_KEY = "kkamji_fs";
const FS_SCALES = [1, 1.15, 1.3, 1.5, 1.75, 2];
const FS_DEFAULT = 5; // 200% — 노안 대응 기본값
let fsLevel = FS_DEFAULT;
try {
  const saved = parseInt(localStorage.getItem(FS_KEY), 10);
  if (!isNaN(saved)) fsLevel = saved;
} catch (e) {}
fsLevel = Math.min(Math.max(fsLevel, 0), FS_SCALES.length - 1);
function applyFs() {
  document.documentElement.style.setProperty("--fs-scale", FS_SCALES[fsLevel]);
  $("fs-level").textContent = Math.round(FS_SCALES[fsLevel] * 100) + "%";
  try { localStorage.setItem(FS_KEY, String(fsLevel)); } catch (e) {}
}
$("fs-plus").addEventListener("click", () => {
  if (fsLevel < FS_SCALES.length - 1) { fsLevel++; applyFs(); }
});
$("fs-minus").addEventListener("click", () => {
  if (fsLevel > 0) { fsLevel--; applyFs(); }
});
applyFs();

/* ── 인쇄 (의원별·질문순, A4 한 장에 하나) ────── */
function buildPrintPages() {
  const root = $("print-root");
  root.textContent = "";
  const today = new Date().toLocaleDateString("ko-KR");
  let count = 0;

  MEMBERS.forEach(m => {                       // 화면과 같은 순서: 위원장 → 여당 → 야당 → 비교섭단체
    (DATA[m.id] || []).forEach((qa, i) => {     // 질문 번호 순서 그대로
      if (!filled(qa)) return;                  // 비어 있는 칸은 빈 페이지가 되므로 제외
      count++;

      const page = document.createElement("article");
      page.className = "print-page";

      const head = document.createElement("div");
      head.className = "pp-head";
      const who = document.createElement("span");
      who.className = "pp-member";
      who.textContent = m.name + (m.role ? " " + m.role : "") + " · " + m.pname;
      const no = document.createElement("span");
      no.className = "pp-no";
      no.textContent = "질문 " + (i + 1) + (qa.code ? " · " + qa.code : "");
      head.appendChild(who); head.appendChild(no);
      page.appendChild(head);

      const title = document.createElement("h2");
      title.className = "pp-title";
      title.textContent = qa.t || "(제목 없음)";
      page.appendChild(title);

      if ((qa.k || []).length) {
        const kws = document.createElement("div");
        kws.className = "pp-kws";
        kws.textContent = qa.k.map(k => "#" + k).join("  ");
        page.appendChild(kws);
      }

      const qBox = document.createElement("section");
      qBox.className = "pp-q";
      const qLab = document.createElement("div");
      qLab.className = "pp-label";
      qLab.textContent = "질 문";
      const qBody = document.createElement("div");
      qBody.className = "pp-body";
      qBody.innerHTML = qa.q ? mdRender(qa.q, qa.imgs) : "(질문 내용 미입력)";
      qBox.appendChild(qLab); qBox.appendChild(qBody);
      page.appendChild(qBox);

      const aBox = document.createElement("section");
      aBox.className = "pp-a";
      const aLab = document.createElement("div");
      aLab.className = "pp-label";
      aLab.textContent = "답 변";
      const aBody = document.createElement("div");
      aBody.className = "pp-body";
      aBody.innerHTML = qa.a ? mdRender(qa.a, qa.imgs) : "(답변 미입력)";
      aBox.appendChild(aLab); aBox.appendChild(aBody);
      page.appendChild(aBox);

      if (qa.c) {
        const c = document.createElement("div");
        c.className = "pp-contact";
        c.textContent = "담당: " + qa.c;
        page.appendChild(c);
      }

      const foot = document.createElement("div");
      foot.className = "pp-foot";
      foot.textContent = "깜지 · 과방위 국정감사 질의·답변 · 출력 " + today;
      page.appendChild(foot);

      root.appendChild(page);
    });
  });
  return count;
}

$("q-filter").addEventListener("input", renderQuestions);
$("back-to-members").addEventListener("click", () => { document.body.dataset.view = "members"; });
$("back-to-questions").addEventListener("click", () => { document.body.dataset.view = "questions"; });

/* ── 공용 데이터(data.json) 동기화 ────────────
   저장소의 data.json이 '공용본'이고, 브라우저에 남는 것은 아직 반영되지 않은
   '내 작업본'입니다. 편집 → data.json 내보내기 → 저장소에 커밋하면 전원이 최신본을 봅니다. */
let sharedMembers = null;   // 공용본의 위원별 데이터
const EDITOR_KEY = "kkamji_editor";
let lastEditor = "";
try { lastEditor = localStorage.getItem(EDITOR_KEY) || ""; } catch (e) {}

/* ── GitHub 직접 저장 ────────────────────────
   직원이 개인 액세스 토큰(PAT)으로 로그인하면 저장소의 data.json을 바로 고칩니다.
   저장소 경로는 GitHub Pages 주소에서 자동으로 알아냅니다.
   (내부 서버 등 다른 곳에 올릴 때만 아래 GITHUB_REPO_OVERRIDE 에 "계정/저장소" 를 적으세요.) */
const GITHUB_REPO_OVERRIDE = "";
function detectGithubRepo() {
  if (GITHUB_REPO_OVERRIDE) return GITHUB_REPO_OVERRIDE;
  const m = /^([A-Za-z0-9-]+)\.github\.io$/.exec(location.hostname);
  if (!m) return "";
  const seg = location.pathname.split("/").filter(Boolean)[0];
  // 프로젝트 페이지(owner.github.io/repo) / 계정 페이지(owner.github.io)
  return seg && !/\.html?$/i.test(seg) ? m[1] + "/" + seg : m[1] + "/" + m[1] + ".github.io";
}
const GITHUB_REPO = detectGithubRepo();
const GH_API = GITHUB_REPO
  ? "https://api.github.com/repos/" + GITHUB_REPO + "/contents/" + SHARED_URL
  : "";
const TOKEN_KEY = "kkamji_gh_token";
let githubToken = "";
let githubSha = "";
try { githubToken = sessionStorage.getItem(TOKEN_KEY) || ""; } catch (e) {}

function b64encode(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = "";
  bytes.forEach(b => { bin += String.fromCharCode(b); });
  return btoa(bin);
}
function b64decode(b64) {
  const bin = atob(String(b64).replace(/\s/g, ""));
  return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0)));
}
function ghHeaders(token) {
  const h = { Accept: "application/vnd.github+json" };
  if (token) h.Authorization = "Bearer " + token;
  return h;
}
function forgetToken() {
  githubToken = ""; githubSha = "";
  try { sessionStorage.removeItem(TOKEN_KEY); } catch (e) {}
}

/* 토큰을 받아 저장소 쓰기 권한까지 확인 */
async function connectGithub() {
  if (!GH_API) {
    alert("GitHub 저장소를 찾지 못했습니다.\n\nGitHub Pages 주소로 열면 자동으로 인식합니다.\n다른 곳에 올렸다면 index.html의 GITHUB_REPO_OVERRIDE 에 \"계정/저장소\"를 적어 주세요.");
    return false;
  }
  if (githubToken) return true;
  const t = (prompt(
    "GitHub 액세스 토큰(PAT)을 붙여넣으세요.\n" +
    "저장소: " + GITHUB_REPO + "\n\n" +
    "GitHub → Settings → Developer settings → Personal access tokens\n" +
    "→ Fine-grained tokens, 권한 Contents: Read and write"
  ) || "").trim();
  if (!t) return false;
  try {
    const res = await fetch(GH_API, { headers: ghHeaders(t), cache: "no-store" });
    if (!res.ok) {
      alert(res.status === 401 ? "토큰이 유효하지 않습니다."
          : res.status === 403 ? "이 저장소에 접근할 권한이 없습니다."
          : res.status === 404 ? "저장소나 data.json을 찾지 못했습니다. (" + GITHUB_REPO + ")"
          : "인증에 실패했습니다. (오류 " + res.status + ")");
      return false;
    }
    const d = await res.json();
    githubSha = d.sha;
    githubToken = t;
    try { sessionStorage.setItem(TOKEN_KEY, t); } catch (e) {}
    return true;
  } catch (e) {
    alert("GitHub에 연결하지 못했습니다. 인터넷 연결을 확인해 주세요.");
    return false;
  }
}

async function saveToGithub() {
  if (!(await connectGithub())) return;

  const who = (prompt("작성자 이름을 적어 주세요. (커밋 기록용)", lastEditor || "") || "").trim();
  if (who) {
    lastEditor = who;
    try { localStorage.setItem(EDITOR_KEY, who); } catch (e) {}
  }

  const btn = $("btn-gh-save");
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = "저장 중…";
  try {
    // 최신 sha 확보 (다른 사람이 먼저 저장했을 수 있음)
    const head = await fetch(GH_API, { headers: ghHeaders(githubToken), cache: "no-store" });
    if (head.ok) githubSha = (await head.json()).sha;

    const stamp = new Date().toISOString();
    const payload = { updatedAt: stamp, updatedBy: who || "(미기재)", members: DATA };
    const res = await fetch(GH_API, {
      method: "PUT",
      headers: Object.assign(ghHeaders(githubToken), { "Content-Type": "application/json" }),
      body: JSON.stringify({
        message: "깜지 답변자료 수정" + (who ? " (" + who + ")" : ""),
        content: b64encode(JSON.stringify(payload, null, 2) + "\n"),
        sha: githubSha
      })
    });

    if (!res.ok) {
      if (res.status === 409 || res.status === 422) {
        alert("다른 분이 방금 먼저 저장했습니다.\n페이지를 새로고침해 최신본을 받은 뒤 다시 저장해 주세요.");
      } else if (res.status === 401) {
        forgetToken();
        alert("토큰이 만료되었습니다. 다시 저장을 눌러 토큰을 입력해 주세요.");
      } else if (res.status === 403) {
        alert("이 저장소에 쓰기 권한이 없습니다. 토큰 권한(Contents: Read and write)을 확인해 주세요.");
      } else {
        alert("GitHub 저장에 실패했습니다. (오류 " + res.status + ")");
      }
      return;
    }

    const out = await res.json();
    githubSha = out.content.sha;
    // 방금 올린 내용이 곧 공용본
    sharedMembers = JSON.parse(JSON.stringify(DATA));
    sharedStamp = stamp;
    sharedInfo = payload;
    clearLocalDraft();
    lastExportStamp = null;
    renderStatus();
    alert("GitHub에 저장했습니다.\n\nGitHub Pages 주소로 보는 분들은 반영까지 1분 정도 걸릴 수 있습니다.");
  } catch (e) {
    alert("GitHub에 연결하지 못했습니다. 인터넷 연결을 확인해 주세요.");
  } finally {
    btn.disabled = false; btn.textContent = label;
  }
}
$("btn-gh-save").addEventListener("click", saveToGithub);
if (GH_API) $("btn-gh-save").hidden = false;

function fmtStamp(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return "";
  return d.toLocaleString("ko-KR", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
}
function draftCount() {
  if (!sharedMembers) return 0;
  const base = adoptMembers(sharedMembers);
  let n = 0;
  MEMBERS.forEach(m => {
    if (JSON.stringify(DATA[m.id] || []) !== JSON.stringify(base[m.id] || [])) n++;
  });
  return n;
}
function renderStatus() {
  const chip = $("sync-chip");
  chip.classList.remove("draft", "offline");
  if (!sharedStamp) {
    chip.classList.add("offline");
    chip.textContent = "공용 파일 없음 · 이 기기에만 저장";
    chip.title = "data.json을 찾지 못했습니다. 웹서버(예: GitHub Pages)로 열면 공용본을 함께 받습니다.";
    return;
  }
  if (hasLocalDraft) {
    chip.classList.add("draft");
    const n = draftCount();
    chip.textContent = "내 수정 " + (n ? n + "명 " : "") + "미반영";
    chip.title = "편집 모드에서 'data.json 내보내기' 후 저장소에 올리면 전원에게 반영됩니다.";
  } else {
    chip.textContent = "공용본 최신 · " + fmtStamp(sharedStamp);
    chip.title = "작성자: " + ((sharedInfo && sharedInfo.updatedBy) || "미기재");
  }
}
/* 칩을 누르면 최신 공용본을 다시 받아옵니다 (국감 중 새로고침 대용) */
$("sync-chip").addEventListener("click", async () => {
  const chip = $("sync-chip");
  const prev = chip.textContent;
  chip.textContent = "확인 중…";
  await syncShared();
  if (chip.textContent === "확인 중…") chip.textContent = prev;
});

function showBanner(text) {
  $("banner-text").textContent = text;
  $("banner").hidden = false;
}
$("bn-take-shared").addEventListener("click", () => {
  clearLocalDraft();
  DATA = adoptMembers(sharedMembers);
  selQ = 0;
  $("banner").hidden = true;
  renderMembers(); renderQuestions(); renderQA(); renderStatus();
});
$("bn-keep-mine").addEventListener("click", () => {
  $("banner").hidden = true;
  saveData();   // 현재 공용본 기준으로 작업본을 다시 기록
});

async function syncShared() {
  let shared = null;
  // 토큰이 있는 직원은 GitHub API로 최신본을 직접 받습니다(Pages 반영 지연 없음).
  if (githubToken && GH_API) {
    try {
      const res = await fetch(GH_API, { headers: ghHeaders(githubToken), cache: "no-store" });
      if (res.ok) {
        const d = await res.json();
        githubSha = d.sha;
        shared = JSON.parse(b64decode(d.content));
      } else if (res.status === 401) {
        forgetToken();
      }
    } catch (e) { /* 오프라인 → 아래 파일 방식으로 */ }
  }
  if (!shared) {
    try {
      const res = await fetch(SHARED_URL, { cache: "no-store" });
      if (res.ok) shared = await res.json();
    } catch (e) { /* 파일 없음·오프라인·file:// 직접 열기 */ }
  }

  const local = readLocal();

  if (!shared || !shared.members) {
    // 공용본 없음 → 내 작업본 또는 내장 기본 자료
    if (local) { DATA = adoptMembers(local.members); hasLocalDraft = true; }
    renderMembers(); renderQuestions(); renderQA(); renderStatus();
    return;
  }

  sharedMembers = shared.members;
  sharedStamp = shared.updatedAt || null;
  sharedInfo = shared;

  if (!local) {
    DATA = adoptMembers(sharedMembers);
  } else if (lastExportStamp && sharedStamp === lastExportStamp) {
    // 내가 내보낸 파일이 저장소에 반영됨 → 작업본 정리
    DATA = adoptMembers(sharedMembers);
    clearLocalDraft();
    lastExportStamp = null;
  } else if (local.basedOn === sharedStamp) {
    // 현재 공용본 위에서 작업 중
    DATA = adoptMembers(local.members);
    hasLocalDraft = true;
  } else {
    // 내가 작업하는 사이 공용본이 갱신됨 → 사용자가 선택
    DATA = adoptMembers(local.members);
    hasLocalDraft = true;
    showBanner("공용본이 갱신되었습니다 (" + fmtStamp(sharedStamp) +
      ", 작성자 " + (shared.updatedBy || "미기재") + "). 내 수정본과 어느 쪽을 사용할까요?");
  }
  renderMembers(); renderQuestions(); renderQA(); renderStatus();
}

document.body.dataset.view = "members";
applyMode(userMode || defaultMode());
renderMembers(); renderQuestions(); renderQA(); renderStatus();
syncShared();
</script>
